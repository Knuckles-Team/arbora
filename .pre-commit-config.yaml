# Combined pre-commit and pre-push suite for arbora, and the single source
# of the release workflow's gates: CI runs this file (commit and push stages
# over every file, then the manual-stage hooks that need the provisioned
# environment), so local and hosted runs execute the same gate code.
#
# Every repository-agnostic gate -- complexity, KISS, clones, secrets,
# privacy, hygiene and code shape -- comes from the shared hook repository
# Knuckles-Team/pipelines at main; repository-specific inputs are
# declared in pyproject.toml `[tool.pipelines_hooks]`. Hooks that need a
# sibling checkout or a synced environment (scripts/local_hook.sh) print
# `SKIPPED (<gate>): <reason>` in a fresh clone and fail closed under CI.
# Provision everything with scripts/bootstrap.sh.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0
  hooks:
  - id: check-added-large-files
    stages: [pre-commit]
    args: ["--maxkb=2000"]
    exclude: ^uv\.lock$
  - id: check-yaml
    stages: [pre-commit]
    args: ["--unsafe"]
    # Helm templates are Go-template text with a .yaml extension, not parsed
    # as plain YAML until `helm template` renders them.
    exclude: ^deploy/helm/arbora/templates/
  - id: check-toml
    stages: [pre-commit]
  - id: check-json
    stages: [pre-commit]
  - id: fix-byte-order-marker
    stages: [pre-commit]
  - id: check-merge-conflict
    stages: [pre-commit]
  - id: detect-private-key
    stages: [pre-commit]
  - id: trailing-whitespace
    stages: [pre-commit]
  - id: end-of-file-fixer
    stages: [pre-commit]

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: 38bfb07c0c64c304f47eb52090f8288150c77730 # v0.17.1
  hooks:
  - id: ruff-check
    stages: [pre-commit]
    args: ["--fix", "--unsafe-fixes"]
  - id: ruff-format
    stages: [pre-commit]

- repo: https://github.com/jendrikseipp/vulture
  rev: b0f67ba0044693aa9ec0d38fe460590facc98004 # v2.16
  hooks:
  - id: vulture
    stages: [pre-push]
    pass_filenames: false
    args: [".", "--min-confidence", "95", "--exclude", ".venv,.uv-workspace-siblings,build,tests"]

- repo: https://github.com/codespell-project/codespell
  rev: 57b21406f092110c18776e39b0bda50d37c945c8 # v2.4.3
  hooks:
  - id: codespell
    stages: [pre-push]
    args: ["--ignore-words=.config/codespell.ignore"]
    exclude: ^(tests/|test/)

- repo: https://github.com/PyCQA/bandit
  rev: 92ae8b82fb422a639f0ed8d99e96cea769594e08 # 1.9.4
  hooks:
  - id: bandit
    stages: [pre-push]
    args: ["--skip", "B101"]
    exclude: ^(tests/|test/)

- repo: https://github.com/AleksaC/hadolint-py
  rev: 6e7504451511eaeb62a3e7f14d63b0296cbf86eb # v2.15.1
  hooks:
  - id: hadolint
    stages: [pre-push]

- repo: https://github.com/astral-sh/uv-pre-commit
  rev: d4acaec07ac3bc6017fba3c3b8e9810af1b615db # 0.13.1
  hooks:
  - id: uv-lock
    stages: [manual]
    args: ["--locked"]
    # Hosted release gates verify the frozen lock after pinned source checkout.

# ── Shared gates (Knuckles-Team/pipelines, main) ─────────────────────────────
- repo: https://github.com/Knuckles-Team/pipelines
  rev: main # sanctioned first-party exception; public-surface gate
  hooks:
  # scanners (pinned versions; never installed by a hook)
  - id: complexity-staged
    stages: [pre-push, manual]
  - id: kiss-staged
    stages: [pre-push, manual]
  - id: dupehound-changed
    stages: [pre-push, manual]
  - id: complexity-census
    stages: [manual]
  # Orphan modules are NOT covered here since kiss 0.4.11 (the check moved
  # to the coverage-linked `kiss test`); arbora's Python orphan-module
  # wiring gate is the check-orphan-modules local hook below.
  - id: kiss-census
    stages: [manual]
  - id: jscpd-differential
    stages: [manual]
  - id: jscpd-census
    stages: [manual]
  - id: scanner-versions
    stages: [manual]
  # code shape
  - id: no-stub
    stages: [pre-push, manual]
  - id: stubs
    stages: [pre-push, manual]
    exclude: ^tests/
  - id: env-sprawl
    stages: [pre-push, manual]
  - id: stdout-writes
    stages: [pre-push, manual]
  - id: swallowed-errors
    stages: [pre-push, manual]
  - id: event-loop-blocking
    stages: [pre-push, manual]
  - id: import-cycles
    stages: [pre-push, manual]
  # public documentation
  - id: public-surface
    stages: [pre-commit, manual]
  - id: ste-staged
    stages: [pre-commit, manual]
  - id: ste-staleness-staged
    stages: [pre-push, manual]
  # secrets, privacy, supply chain, hygiene
  - id: supply-chain
    stages: [pre-push, manual]
  - id: secret-history
    stages: [pre-push, manual]
  - id: security-sanitizer
    stages: [pre-push, manual]
  - id: tracked-privacy
    stages: [pre-push, manual]
  - id: root-hygiene
    stages: [pre-push, manual]
  - id: gitignore-convergence
    stages: [pre-push, manual]
  - id: sprawl
    stages: [pre-push, manual]
  - id: mermaid
    stages: [pre-push, manual]
  - id: pre-commit-patch-safety
    stages: [pre-push, manual]
  # spec-status lifecycle (plans/refactor/reconciliation-20261006/SPEC-STATUS-LIFECYCLE.md)
  - id: spec-status
    stages: [pre-push, manual]
  - id: spec-decomposition
    stages: [pre-push, manual]
  - id: spec-standard
    stages: [pre-commit, manual]
  - id: spec-trailers
    stages: [pre-push, manual]

- repo: local
  hooks:
  # Release readiness checks the external package index, which may lag source
  # commits. The release workflow runs it on version tags only; run it
  # explicitly before a release. Without a repository-manager checkout it is
  # SKIPPED locally and CANNOT RUN (exit 2) under CI.
  - id: dependency-readiness
    name: Dependency readiness - declared and imported dependencies respect layer order
    entry: scripts/local_hook.sh dependency-readiness
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]

  # The isolated mypy hook above ignores missing imports; this one checks
  # arbora against the real locked dependency types.
  - id: mypy-env
    name: mypy (locked environment)
    entry: scripts/local_hook.sh mypy-env
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]

  # Needs the sibling source checkouts and the synced environment that
  # scripts/bootstrap.sh provisions; SKIPPED locally without them.
  - id: pytest
    name: pytest (full suite)
    entry: scripts/local_hook.sh pytest
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]

- repo: local
  hooks:
  # arbora's Python orphan-module wiring gate (see .config/kiss.toml
  # [global] and AGENTS.md "Orphan-module wiring gate (Python)"): a
  # arbora/ module with no production fan-in and no production fan-out
  # (on disk, tracked or not). Needs only the stdlib (ast, tomllib), so it
  # runs in a fresh clone with no synced environment.
  - id: check-orphan-modules
    name: Wiring — no orphan arbora module
    entry: python3 scripts/check_wiring.py orphans
    language: system
    pass_filenames: false
    always_run: true
  # Reports arbora/ modules no declared root (console script, entry point,
  # or the top-level package) reaches by any import edge -- static or
  # dynamic/name-based (see scripts/wiring/reachability.py). This is staged,
  # not-yet-served code: nonzero fan-in/fan-out lets a module pass
  # check-orphan-modules above even when nothing running ever reaches it.
  # Manual stage only -- it reports, it never blocks CI.
  - id: check-unreachable-modules
    name: Wiring — report arbora modules no entry point reaches (not served yet)
    entry: python3 scripts/check_wiring.py unreachable
    language: system
    pass_filenames: false
    always_run: true
    stages: [manual]
  - id: check-public-specs
    name: Public specs are self-contained and locally linked
    entry: python3 scripts/check_public_specs.py
    language: system
    pass_filenames: false
    files: ^(specs/|scripts/check_public_specs\.py$|\.specify/memory/constitution\.md$)
  # Freshness check for this repository's own core-pack skills (see
  # scripts/check_core_skills.py): every backticked repository path and bare
  # console command they mention must still exist on disk / in
  # pyproject.toml / under scripts/. Scoped to arbora's own two core
  # skills for now; the deployment/genesis pair needs its own accuracy pass
  # before it can join this gate noise-free.
  - id: check-core-skills
    name: Core skills reference real paths and commands
    entry: python3 scripts/check_core_skills.py --repo-root . arbora/skills/arbora-development/SKILL.md arbora/skills/using-arbora/SKILL.md
    language: system
    pass_filenames: false
    files: ^(arbora/skills/(arbora-development|using-arbora)/SKILL\.md$|scripts/check_core_skills\.py$)
