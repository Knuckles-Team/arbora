INHERIT: .pipeline-theme/templates/mkdocs-theme/base.mkdocs.yml

site_name: Arbora
site_description: >-
  The governed MCP, REST, A2A, fleet, and Agent Web UI runtime for the Knuckles
  agent platform.
site_url: https://knuckles-team.github.io/arbora/
repo_name: Knuckles-Team/arbora
repo_url: https://github.com/Knuckles-Team/arbora
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true
copyright: Copyright &copy; Knuckles-Team — MIT licensed

theme:
  logo: assets/brands/arbora-logo-v1.png
  favicon: assets/brands/arbora-logo-v1.png

plugins:
  - search

extra:
  ecosystem:
    current: arbora

nav:
  - Home: index.md
  - Start Arbora: get-started.md
  - Capabilities: capabilities.md
  - Interfaces: interfaces.md
  - How it fits: architecture.md
  - Specification status: spec-status.html
  - Use Arbora:
      - MCP server: mcp-server.md
      - REST gateway: gateway.md
      - Fleet gateway: fleet.md
      - Unary A2A: a2a.md
      - Browser control: browser-control-service.md
  - Operate:
      - Deployment and configuration: deployment.md
      - Release-qualification runbook: release-qualification-runbook.md
      - Identity and authentication: identity.md
      - Capability status: status.md
      - Quality gate terms: quality-gate-terms.md
  - Glossary: glossary.md
