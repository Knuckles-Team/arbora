# Render-only defaults use the reserved .invalid domain. A deployment MUST override
# every enabled image with an approved immutable reference (digest).
#
# unified-in-process (STANDARD): one pod owns arbora and its epistemic-graph
# engine. The engine runs as a native sidecar container (`engine.placement:
# sidecar`, default) or as a child process arbora supervises inside its own
# container (`engine.placement: child`). Either way the pod is the single writer
# of the engine store: never more than one replica, Recreate strategy only.
#
# out-of-process-shared: a separate engine StatefulSet and stateless arbora
# replicas behind an HPA. Choose it only when those replicas are genuinely
# required; it costs a second workload whose config must match arbora's.
topology: unified-in-process

nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

rbac:
  create: true

# Kubernetes service-link variables collide with arbora configuration names;
# keep them off for every pod this chart renders.
enableServiceLinks: false

runtimeSecret:
  # Created/synchronized outside this chart (External Secrets, a CSI driver, or
  # an operator-run `kubectl create secret`). No secret values belong in values.
  # Both arbora and the engine read it: GRAPH_SERVICE_AUTH_SECRET (the shared
  # envelope HMAC), MEDULLA_* engine secrets, and optional
  # ARBORA_SETUP_CODE.
  name: arbora-runtime
  optional: false

# Identity mode. Forward configuration: arbora does not read
# ARBORA_AUTH_MODE yet (today it always authenticates through an external
# OIDC issuer; see the arbora-deployment skill's "Not available yet"
# section). Once served, the mode is DURABLE engine state; this value only
# seeds it on first boot and the stored mode wins after.
identity:
  # none | local | external. A pod never binds loopback only, so `none` renders
  # only with the exact acknowledgement below.
  mode: local
  # ARBORA_IDENTITY_ISSUER / ARBORA_IDENTITY_TENANT: required outside tiny.
  issuer: ""
  tenant: ""
  # Exact string I-UNDERSTAND-ANYONE-WHO-CAN-REACH-THIS-PORT-IS-ADMIN, or empty.
  noneExposeAck: ""
  noneHostname: ""

policy:
  eunomia:
    # "" derives from identity.mode: none -> none, local/external -> embedded.
    # When on, an unreachable policy decision point fails closed.
    type: ""
    # Container path of the policy document (mount it with arbora.extraVolumes).
    policyFile: ""
    remoteUrl: ""

secrets:
  # vault = a Vault-compatible store (SECRETS_VAULT_URL + an auth method in
  # config). It is the only secrets backend.
  backend: vault
  vaultUrl: https://secrets.example.invalid

telemetry:
  # OTLP endpoint for traces/metrics/logs; empty disables export.
  otlpEndpoint: ""
  # First-party browser RUM relay target (the collector's OTLP metrics
  # receiver). RUM is on by default in the web UI; empty accepts and drops.
  rumOtlpMetricsEndpoint: ""

capacity:
  # SCALING_PROMETHEUS_URL for the fleet throttle controller (observe-only by
  # default); empty leaves throttling without measurements.
  prometheusUrl: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

arbora:
  image:
    repository: registry.invalid/arbora/arbora
    tag: replace-me
    digest: ""
    pullPolicy: IfNotPresent
  # Only out-of-process-shared honours values above 1.
  replicas: 1
  port: 8000
  # arbora serves the web UI in-process on this port when webUi is true.
  webUi: true
  webUiPort: 8080
  args:
    - arbora
    - --transport
    - streamable-http
    - --host
    - "0.0.0.0"
    - --port
    - "8000"
  # Host header the kubelet probes send; it must be an allowed host.
  probeHostHeader: localhost
  config:
    APP_PROFILE: production
    DEPLOYMENT_PROFILE: enterprise
    ALLOWED_HOSTS: localhost
  resources:
    requests: {cpu: 500m, memory: 2Gi}
    limits: {cpu: "8", memory: 16Gi}
  # Holds engine data (unified topology) and arbora XDG config/data/state.
  persistence:
    size: 100Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  extraVolumes: []
  extraVolumeMounts: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

engine:
  # unified-in-process only: sidecar | child.
  placement: sidecar
  # Empty repository = reuse arbora.image (the unified image carries the
  # medulla-server binary). The shared StatefulSet needs its own value.
  image:
    repository: ""
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  replicas: 1
  port: 9100
  # Expose the engine's TCP listener (required for out-of-process-shared, and for
  # fleet connectors that must reach the same engine). Non-loopback TCP requires TLS.
  tcp:
    enabled: false
  tls:
    # Secret with tls.crt / tls.key for the engine TCP listener.
    secretName: ""
  extraArgs: []
  config:
    MEDULLA_PERSIST_BACKEND: redb
  # Separate volume only for out-of-process-shared; unified uses arbora.persistence.
  persistence:
    size: 100Gi
    storageClass: ""
    accessModes: [ReadWriteOnce]
  resources:
    requests: {cpu: "1", memory: 4Gi}
    limits: {cpu: "8", memory: 32Gi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

service:
  type: ClusterIP
  port: 80
  webUiPort: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  # MCP + REST/A2A control plane.
  api:
    host: arbora.example.invalid
    path: /
  # Browser web UI (sign-in, first-run setup, admin). Empty host = no UI ingress.
  webUi:
    host: arbora-ui.example.invalid
    path: /
  tls:
    enabled: true
    secretName: arbora-tls

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: null

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  # Extra NetworkPolicyPeer entries allowed to reach arbora (e.g. the ingress
  # controller's namespace). Same-namespace traffic is always allowed.
  ingressFrom: []
  egress:
    # Empty means DNS plus same-namespace traffic only. Add explicit CIDRs or
    # selectors for the identity provider, secret store, models and connectors.
    extra: []

# Fleet MCP connectors arbora multiplexes (resolved by arbora-deployment).
connectors: []
# - name: example-mcp
#   image: {repository: registry.invalid/arbora/example-mcp, tag: replace-me, digest: ""}
#   port: 8000
#   args: []
#   env: {TRANSPORT: streamable-http, PORT: "8000"}
#   secretName: example-mcp-runtime
#   replicas: 1
#   resources: {requests: {cpu: 100m, memory: 256Mi}, limits: {cpu: "1", memory: 1Gi}}

# Extra first-party workloads. The web UI is NOT one of them: arbora serves it
# in-process, and a second copy would need an identity that cannot sign admission.
components: []
