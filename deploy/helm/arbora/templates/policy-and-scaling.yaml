{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "arbora.fullname" . }}
  labels:
    {{- include "arbora.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.api.host }}
      http:
        paths:
          - path: {{ .Values.ingress.api.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "arbora.fullname" . }}-arbora
                port: {name: http}
    {{- if and .Values.arbora.webUi .Values.ingress.webUi.host }}
    - host: {{ .Values.ingress.webUi.host }}
      http:
        paths:
          - path: {{ .Values.ingress.webUi.path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "arbora.fullname" . }}-arbora
                port: {name: webui}
    {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.api.host }}
        {{- if and .Values.arbora.webUi .Values.ingress.webUi.host }}
        - {{ .Values.ingress.webUi.host }}
        {{- end }}
      secretName: {{ required "ingress.tls.secretName is required when TLS is enabled" .Values.ingress.tls.secretName }}
  {{- end }}
{{- end }}
{{- if and .Values.autoscaling.enabled (not (include "arbora.unified" .)) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "arbora.fullname" . }}-arbora
  labels:
    {{- include "arbora.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "arbora.fullname" . }}-arbora
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- with .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ . }}}
    {{- end }}
    {{- with .Values.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target: {type: Utilization, averageUtilization: {{ . }}}
    {{- end }}
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "arbora.fullname" . }}-arbora
  labels:
    {{- include "arbora.labels" . | nindent 4 }}
spec:
  # A single-writer unified pod cannot keep one available through a drain.
  minAvailable: {{ if include "arbora.unified" . }}0{{ else }}{{ .Values.podDisruptionBudget.minAvailable }}{{ end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: arbora
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "arbora.fullname" . }}-default
  labels:
    {{- include "arbora.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
        {{- with .Values.networkPolicy.ingressFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.arbora.port }}}
        {{- if .Values.arbora.webUi }}
        - {protocol: TCP, port: {{ .Values.arbora.webUiPort }}}
        {{- end }}
        {{- if include "arbora.engineTcp" . }}
        - {protocol: TCP, port: {{ .Values.engine.port }}}
        {{- end }}
    {{- $extensions := concat .Values.connectors .Values.components }}
    {{- if $extensions }}
    # Extension ports are reachable only from this namespace; ingressFrom
    # continues to grant access only to the core service ports above.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        {{- $ports := list }}
        {{- range $extension := $extensions }}
        {{- $ports = append $ports $extension.port }}
        {{- end }}
        {{- range $port := $ports | uniq }}
        - {protocol: TCP, port: {{ $port }}}
        {{- end }}
    {{- end }}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- with .Values.networkPolicy.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
