# Arbora on one host (laptop, workstation or a small durable server).
#
# One service: the arbora process serves MCP + REST/A2A on 8000 and the web UI
# on 8080, and starts/supervises its epistemic-graph engine as a child process
# inside the same container (the unified topology; the engine binary ships in the
# unified image). The engine store lives on the `arbora-data` volume and has
# exactly one writer: never scale this service.
#
# Usage (Docker Compose v2.24+, or `podman compose`):
#   cp .env.example .env                     # image + mode (compose interpolation)
#   cp arbora.env.example arbora.env     # secret values; never commit either copy
#   docker compose config --quiet && docker compose up -d
#   docker compose logs arbora | grep 'setup code'   # local mode first boot
#
# Ports are published on 127.0.0.1 only. Publishing on another address is an
# exposure decision: use identity mode local or external and put TLS in front.
name: arbora

services:
  arbora:
    image: ${ARBORA_IMAGE:?set ARBORA_IMAGE to an immutable arbora image reference, e.g. registry.example/arbora@sha256:<digest>}
    command:
      - arbora
      - --transport
      - streamable-http
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    restart: unless-stopped
    stop_grace_period: 90s
    environment:
      APP_PROFILE: ${ARBORA_APP_PROFILE:-dev}
      DEPLOYMENT_PROFILE: ${ARBORA_DEPLOYMENT_PROFILE:-tiny}
      # none | local | external. Seeds the durable mode on FIRST boot only.
      ARBORA_AUTH_MODE: ${ARBORA_AUTH_MODE:-local}
      # Inside a container the bind is never loopback, so `none` also needs the
      # exact acknowledgement (see .env.example). Keep the 127.0.0.1 port
      # publishing below when you use it.
      ARBORA_AUTH_NONE_EXPOSE: ${ARBORA_AUTH_NONE_EXPOSE:-}
      # Eunomia per mode: none -> none; local/external -> embedded (fails closed).
      EUNOMIA_TYPE: ${EUNOMIA_TYPE:-embedded}
      # Tiny installs keep secrets in the engine's encrypted secrets graph.
      SECRETS_BACKEND: ${SECRETS_BACKEND:-vault}
      ALLOWED_HOSTS: ${ARBORA_ALLOWED_HOSTS:-localhost,127.0.0.1}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      RUM_OTLP_METRICS_ENDPOINT: ${RUM_OTLP_METRICS_ENDPOINT:-}
    env_file:
      # Fixed, non-tunable internal wiring for the unified topology (shared
      # with deploy/swarm/stack.yml, which keeps its own literal copy since
      # Swarm does not read env_file).
      - path: ./arbora-runtime.env
      # Secret values (GRAPH_SERVICE_AUTH_SECRET, optional ARBORA_SETUP_CODE,
      # provider keys). Optional: without it arbora generates the engine secret
      # per install and the doctor flags it for rotation.
      - path: ./arbora.env
        required: false
    ports:
      - "127.0.0.1:${ARBORA_API_PORT:-8000}:8000"
      - "127.0.0.1:${ARBORA_UI_PORT:-8080}:8080"
    volumes:
      - arbora-data:/var/lib/arbora
      - arbora-run:/run/epistemic-graph
    tmpfs:
      - /tmp
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/health/ready', headers={'Host': 'localhost'}), timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      # A large store recovers for minutes on a cold start.
      start_period: 300s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  arbora-data: {}
  arbora-run: {}
