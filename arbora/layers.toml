# Unit layers of the arbora package (ARBORA-HOST-R038).
#
# Layers are listed most stable first. A unit is a top-level module or package
# directly under arbora/. A unit imports only its own layer or an earlier one,
# units of one layer form no cycle, and no unit imports a leading-underscore
# module or name of another unit. A call from an earlier layer to a later one
# goes through a port the earlier layer declares and the composition root
# (mcp_server) binds. Every unit is named in exactly one layer; there is no
# allowance list. The coupling gate (PIPE-GATES-R088) and
# tests/architecture/test_unit_layers.py read this file.

[[layer]]
name = "foundation"
units = [
  "architecture",
  "content",
  "core",
  "semantic_content",
  "skills",
  "unique_records",
  "version",
]

[[layer]]
name = "security"
units = ["access", "security"]

[[layer]]
name = "services"
units = [
  "data_migrations",
  "ecosystem",
  "epistemic",
  "identity",
  "messaging",
  "modality",
  "observability",
  "run_origin",
]

[[layer]]
name = "operations"
units = [
  "agent_runs",
  "api",
  "current_plan_publication",
  "native_run_admission",
  "work_items",
]

[[layer]]
name = "subsystems"
units = [
  "a2a",
  "acp",
  "agent_host",
  "browser_control",
  "certification",
  "connector_runner",
  "control_plane",
  "deployment",
  "evolution",
  "finance",
  "fleet",
  "fleet_tool_call",
  "gateway",
  "ingest",
]

[[layer]]
name = "host"
units = [
  "__init__",
  "client",
  "console",
  "host_bindings",
  "local_browser_boundary",
  "local_browser_channel",
  "mcp_server",
  "webui_host",
]
