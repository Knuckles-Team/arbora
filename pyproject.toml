[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-os"
dynamic = ["version"]
description = "The deployable MCP, REST, control-plane, fleet, WebUI, and operations composition for the Knuckles agent platform."
readme = "README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12,<3.15"
license = "MIT"
# Runtime requirements imported by the gateway, control plane, and deployment
# surfaces. Connector widgets delegate through the served fleet and never
# install connector clients.
dependencies = [
    # AU 3.0.0 is the cut harness-only release: it ships no mcp/, gateway/,
    # server/ or api/ packages. graph-os owns the MCP/REST serving surface
    # (graph_os/mcp_server/backing, graph_os/api/contracts), so the former
    # `[mcp]` extra's requirements are declared directly below.
    "agent-utilities>=3.0.0,<4.0.0",
    "eunomia-core>=0.3.10",
    "httpx>=0.28.1",
    "pyjwt>=2.15.1",
    # graph_os.security.auth verifies bearer JWTs against the issuer's JWKS.
    "joserfc>=1.7.5",
    "python-multipart>=0.0.32",
    # GraphOS is the deployment composition root for connector workers.  The
    # SDK owns source transport and runner construction; GraphOS supplies its
    # authenticated epistemic-graph client through the SDK's public injection
    # seam and never imports connector implementations.
    "agent-connector-sdk>=0.2.0,<1.0.0",
    # The messaging channel layer's HTTP alert intake (graph_os/messaging/alert_intake.py)
    # imports aiohttp.web directly for its small webhook listener; platform-agnostic,
    # so unlike the chat-platform SDKs below this is not conditioned on a messaging extra.
    "aiohttp>=3.14.5",
    # The fleet gateway imports the MCP protocol/client and FastMCP middleware
    # directly; keep these first-party runtime requirements explicit rather
    # than relying on AU's optional extra to expose them transitively.
    "anyio>=4.15.1",
    # Production operations and the canary call the public client/numeric
    # surface directly; AU's transitive requirement is not enough for this
    # package's own imports. The root source override below aligns AU and SDK
    # on the GraphOS-compatible revision without changing the published floor.
    "epistemic-graph[server]>=2.27.1,<3.0.0",
    "fastapi>=0.143.3",
    "filelock>=4.2.0",
    "prometheus-client>=0.26.0",
    # Matches the agent-connector-sdk floor (agent-utilities allows the 2.14 line).
    "pydantic>=2.14.1,<3.0.0",
    "PyYAML>=6.0.3",
    "starlette>=1.8.0",
    "fastmcp>=4.1.0",
    "mcp>=2.3.0,<3.0.0",
    "opentelemetry-api>=1.45.1",
    "pydantic-ai-slim[openai]==2.57.0",
    # Installed so its ``agent_utilities.skill_providers`` entry point (once
    # declared in universal-skills' own package) resolves in THIS process,
    # the same way agent-utilities', epistemic-graph's, and graph-os's own
    # skills already do — see graph_os/fleet/local_skill_catalog.py. No
    # transitive dependencies of its own.
    "universal-skills>=1.3.11,<2.0.0",
]

[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.optional-dependencies]
# Test-only, real tooling versions matched to agent-utilities' floors
# (agent-packages/agent-utilities/pyproject.toml `[project.optional-dependencies].test`)
# so a lockstep upgrade there is easy to mirror here later.
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "mypy>=2.4.0",
    "ruff==0.17.1",
    "types-PyYAML>=6.0.12.20260906",
    # DEV/TEST-ONLY. setuptools is already a `[build-system] requires` floor
    # (>=84.0.0) for this project's own PEP 517 backend — build requirements
    # are installed only into an ephemeral build environment, not the runtime
    # venv. tests/test_dependency_manifest.py reads
    # `setuptools.config.pyprojecttoml` directly to prove the published
    # manifest contract (host-composition-boundary spec, dependency-manifest
    # requirement), and tests/gateway/test_gateway_widgets_extra.py does the same, so the same floor must also be reachable at test time.
    "setuptools>=84.0.0",
]
webui = [
    "agent-webui>=2.6.3,<3.0.0",
    "uvicorn>=0.54.0",
]
# portable-deployment spec, gateway-widgets extra requirement: graph_os/gateway/widgets/*.py
# each call BaseWidget._fleet_client() (graph_os/fleet) for live data -- the served
# fleet admission seam, never a direct connector-package import (see the
# `dependencies` comment above). No widget today transitively needs a
# fleet connector package's own distribution, but any future widget that
# does must resolve a connector built against agent-connector-sdk's current,
# post-split module layout, not a pre-split agent-utilities-runtime shape.
# This extra is GraphOS's side of that floor -- the agent-utilities
# `gateway-widgets` extra it replaces (retired there under the AU boundary /
# host-composition-boundary spec) pinned the same SDK transitively
# through each connector package's own dependency on it. Full requirement
# IDs: specs/portable-deployment/requirements.md,
# specs/host-composition-boundary/requirements.md.
gateway-widgets = [
    "agent-connector-sdk>=0.2.0,<1.0.0",
]
# Messaging channel adapters (CONCEPT:AU-ECO.messaging.native-backend-abstraction):
# each chat platform SDK is its own extra so importing graph_os.messaging never
# requires every platform's client library to be installed. Further platforms
# (Discord, Slack, WhatsApp, Teams, Google Chat/Meet, Matrix, IRC, Signal,
# iMessage, LINE, Twitch, Synology Chat, voice calls, Nextcloud Talk) follow
# the same adapter shape and remain to be landed.
# graph_os.security.secrets: the KV v2 secret store backend.
vault = ["hvac>=2.4.0"]
messaging-telegram = ["python-telegram-bot>=22.8"]
messaging-mattermost = ["mattermostdriver>=7.3.2"]
messaging-discord = ["discord.py>=2.7.1"]
messaging-slack = ["slack-bolt>=1.30.0"]
messaging-whatsapp = ["neonize>=0.5.2", "httpx>=0.28.1"]
messaging-teams = ["botbuilder-core>=4.17.1"]
messaging-googlechat = ["google-api-python-client>=2.198.0", "google-auth>=2.62.0"]
messaging-googlemeet = ["google-api-python-client>=2.198.0", "google-auth>=2.62.0"]
messaging-matrix = ["matrix-nio>=0.26.0"]
messaging-irc = ["irc>=20.5.0"]
messaging-signal = []
messaging-imessage = []  # macOS-only, AppleScript bridge
messaging-line = ["line-bot-sdk>=3.26.0"]
messaging-twitch = ["twitchio>=3.3.2"]
messaging-synology = ["httpx>=0.28.1"]
messaging-voicecall = ["twilio>=9.12.0"]
messaging-nextcloud = ["httpx>=0.28.1"]
messaging = [
    "graph-os[messaging-telegram,messaging-mattermost,messaging-discord,messaging-slack,messaging-whatsapp,messaging-teams,messaging-googlechat,messaging-googlemeet,messaging-matrix,messaging-irc,messaging-signal,messaging-line,messaging-twitch,messaging-synology,messaging-voicecall,messaging-nextcloud]"
]

[project.scripts]
graph-os = "graph_os.mcp_server.server:mcp_server"
graph-os-daemon = "graph_os.gateway.daemon:main"
graph-os-release-canary = "graph_os.deployment.release_canary:main"
graph-os-production-ops = "graph_os.deployment.production_ops:main"
setup-config = "graph_os.deployment.cli:main"
agent-utilities-doctor = "graph_os.deployment.doctor:main"
agent-utilities-venv = "graph_os.deployment.venv_sync:main"
graph-os-wiring-sweep = "graph_os.evolution.wiring_sweep:main"
graph-os-connector-count-pins = "graph_os.fleet.connector_count_pins:main"
graph-os-check-import-boundaries = "graph_os.architecture.boundary_census:main"
graph-os-hosting-config = "graph_os.deployment.host_config:main"
graph-os-capability-layers = "graph_os.architecture.capability_layers:main"

[project.entry-points."agent_connector_sdk.skill_providers"]
graph-os = "graph_os.skills"

[project.entry-points."agent_utilities.messaging"]
telegram = "graph_os.messaging.backends.telegram:TelegramBackend"
mattermost = "graph_os.messaging.backends.mattermost:MattermostBackend"
discord = "graph_os.messaging.backends.discord:DiscordBackend"
slack = "graph_os.messaging.backends.slack:SlackBackend"
whatsapp = "graph_os.messaging.backends.whatsapp:WhatsAppBackend"
teams = "graph_os.messaging.backends.teams:TeamsBackend"
googlechat = "graph_os.messaging.backends.googlechat:GoogleChatBackend"
googlemeet = "graph_os.messaging.backends.googlemeet:GoogleMeetBackend"
matrix = "graph_os.messaging.backends.matrix:MatrixBackend"
irc = "graph_os.messaging.backends.irc:IRCBackend"
signal = "graph_os.messaging.backends.signal:SignalBackend"
imessage = "graph_os.messaging.backends.imessage:IMessageBackend"
line = "graph_os.messaging.backends.line:LINEBackend"
twitch = "graph_os.messaging.backends.twitch:TwitchBackend"
synology = "graph_os.messaging.backends.synology:SynologyChatBackend"
voicecall = "graph_os.messaging.backends.voicecall:VoiceCallBackend"
nextcloud = "graph_os.messaging.backends.nextcloud:NextcloudTalkBackend"

[project.entry-points."agent_utilities.messaging.reach"]
notify_sync = "graph_os.messaging.reach:notify_sync"
service = "graph_os.messaging.reach:service_port"

# Train-only bindings until AU 3.0.0 and SDK 0.2.0 publish to the index.
# Package metadata keeps the real PEP 508 floors above, so released wheels
# resolve from the index.
[tool.uv]
# A dependency's own git pin of the engine never applies here.
override-dependencies = [
    "epistemic-graph[server]>=2.27.1,<3.0.0",
    # Train-only: agent-webui's branch pins the SDK at main; the train uses
    # one SDK revision for every package until SDK 0.2.0 publishes.
    "agent-connector-sdk @ git+https://github.com/Knuckles-Team/agent-connector-sdk.git@feat/au-handoffs",
    # Train-only: agent-webui's branch pins pydantic-ai 2.54.0; one version
    # serves the train until the webui release aligns its pin.
    "pydantic-ai-slim[openai,ui]==2.57.0",
]

[tool.uv.sources]
agent-utilities = { git = "https://github.com/Knuckles-Team/agent-utilities.git", branch = "refactor/au-cut-to-eg" }
agent-connector-sdk = { git = "https://github.com/Knuckles-Team/agent-connector-sdk.git", branch = "feat/au-handoffs" }
agent-webui = { git = "https://github.com/Knuckles-Team/agent-webui.git", branch = "feat/drop-au-imports" }
# The engine always resolves from the package index, never from a git or
# path source declared by a dependency.
epistemic-graph = { index = "pypi" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[tool.setuptools.dynamic]
version = { attr = "graph_os._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["graph_os*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
graph_os = ["ontology/**/*.ttl", "skills/**", "mcp_server/graphos_operations.json", "mcp_server/backing/graphos_capabilities.json", "api/generated/*.json", "api/generated/schemas/*.json"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Deployment modules use long operator remediations and guarded imports. Keep
# these narrow exceptions while retaining import, correctness, and modern
# Python checks across GraphOS.
ignore = ["E402", "E501", "B007"]

[tool.ruff.lint.flake8-bugbear]
# FastMCP tool parameters and FastAPI dependencies declare metadata through
# these calls in argument defaults; they are evaluated once and immutable.
extend-immutable-calls = ["pydantic.Field", "fastapi.Depends", "fastmcp.dependencies.Depends"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "spec: binds a test to a spec requirement ID",
    "integration: integration test (moved agent-utilities profile tests)",
    "concept: binds a test to a concept ID (moved agent-utilities tests)",
]

# Inputs of the shared hooks (Knuckles-Team/pipelines .pre-commit-hooks.yaml).
[tool.pipelines_hooks]
packages = ["graph_os"]

[tool.pipelines_hooks.public_surface]
repository = "Knuckles-Team/graph-os"
distribution = "graph-os"
pages_url = "https://knuckles-team.github.io/graph-os/"
mcp_server = true

# The MCP server and gateway serve stdio/HTTP; stdout there is protocol output.
[tool.pipelines_hooks.stdout_writes]
served_paths = ["graph_os/mcp_server", "graph_os/gateway"]

[tool.pipelines_hooks.ste]
paths = ["README.md", "AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md", "CHANGELOG.md", "docs", "specs"]
exempt = ["specs/_template/*"]
