[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arbora"
dynamic = ["version"]
description = "The deployable MCP, REST, control-plane, fleet, WebUI, and operations composition for the Knuckles agent platform."
readme = "README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
license = "MIT"
# Runtime requirements imported by the gateway, control plane, and deployment
# surfaces. Connector widgets delegate through the served fleet and never
# install connector clients.
dependencies = [
    # AU 3.0.0 is the cut harness-only release: it ships no mcp/, gateway/,
    # server/ or api/ packages. arbora owns the MCP/REST serving surface
    # (arbora/mcp_server/backing, arbora/api/contracts), so the former
    # `[mcp]` extra's requirements are declared directly below.
    "agent-utilities>=3.1.0,<4.0.0",
    "eunomia-core>=0.3.10",
    "httpx>=0.28.1",
    "pyjwt>=2.15.1",
    # arbora.security.auth verifies bearer JWTs against the issuer's JWKS.
    "joserfc>=1.7.5",
    "python-multipart>=0.0.32",
    # Arbora is the deployment composition root for connector workers.  The
    # SDK owns source transport and runner construction; Arbora supplies its
    # authenticated epistemic-graph client through the SDK's public injection
    # seam and never imports connector implementations.
    "agent-connector-sdk[a2a,mcp]>=0.4.2,<0.5.0",
    # The messaging channel layer's HTTP alert intake (arbora/messaging/alert_intake.py)
    # imports aiohttp.web directly for its small webhook listener; platform-agnostic,
    # so unlike the chat-platform SDKs below this is not conditioned on a messaging extra.
    "aiohttp>=3.14.5",
    # The fleet gateway imports the MCP protocol/client and FastMCP middleware
    # directly; keep these first-party runtime requirements explicit rather
    # than relying on AU's optional extra to expose them transitively.
    "anyio>=4.15.1",
    # Production operations and the canary call the public client/numeric
    # surface directly; AU's transitive requirement is not enough for this
    # package's own imports. The root source override below aligns AU and SDK
    # on the Arbora-compatible revision without changing the published floor.
    "epistemic-graph[server]>=2.27.5,<3.0.0",
    "fastapi>=0.143.3",
    "filelock>=4.2.0",
    # The served source reads (arbora.mcp_server.source_reader) decode the
    # engine's stored node and edge property blobs, which the pinned
    # epistemic-graph contract carries as MessagePack `bin`; the engine's own
    # floor is the same.
    "msgpack>=1.2.1",
    "prometheus-client>=0.26.0",
    # Matches the agent-connector-sdk floor (agent-utilities allows the 2.14 line).
    "pydantic>=2.14.1,<3.0.0",
    "PyYAML>=6.0.3",
    "starlette>=1.8.0",
    "fastmcp>=4.1.0",
    "mcp>=2.3.0,<3.0.0",
    "opentelemetry-api>=1.45.1",
    "pydantic-ai-slim[openai]==2.57.0",
    # Installed so its ``agent_utilities.skill_providers`` entry point (once
    # declared in universal-skills' own package) resolves in THIS process,
    # the same way agent-utilities', epistemic-graph's, and arbora's own
    # skills already do — see arbora/fleet/local_skill_catalog.py. No
    # transitive dependencies of its own.
    "universal-skills>=1.3.11,<2.0.0",
]

[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.optional-dependencies]
# Test-only, real tooling versions matched to agent-utilities' floors
# (agent-packages/agent-utilities/pyproject.toml `[project.optional-dependencies].test`)
# so a lockstep upgrade there is easy to mirror here later.
test = [
    "agent-terminal-ui>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "mypy>=2.4.0",
    "ruff==0.17.1",
    "types-PyYAML>=6.0.12.20260906",
    # The messaging real-boot test drives the Telegram adapter against a local
    # Bot API double (tests/test_real_boot_messaging.py).
    "python-telegram-bot>=22.8",
    # DEV/TEST-ONLY. setuptools is already a `[build-system] requires` floor
    # (>=84.0.0) for this project's own PEP 517 backend — build requirements
    # are installed only into an ephemeral build environment, not the runtime
    # venv. tests/test_dependency_manifest.py reads
    # `setuptools.config.pyprojecttoml` directly to prove the published
    # manifest contract (host-composition-boundary spec, dependency-manifest
    # requirement), and tests/gateway/test_gateway_widgets_extra.py does the same, so the same floor must also be reachable at test time.
    "setuptools>=84.0.0",
]
webui = [
    "agent-webui>=2.8.0,<3.0.0",
    "uvicorn>=0.54.0",
]
# portable-deployment spec, gateway-widgets extra requirement: arbora/gateway/widgets/*.py
# each call BaseWidget._fleet_client() (arbora/fleet) for live data -- the served
# fleet admission seam, never a direct connector-package import (see the
# `dependencies` comment above). No widget today transitively needs a
# fleet connector package's own distribution, but any future widget that
# does must resolve a connector built against agent-connector-sdk's current,
# post-split module layout, not a pre-split agent-utilities-runtime shape.
# This extra is Arbora's side of that floor -- the agent-utilities
# `gateway-widgets` extra it replaces (retired there under the AU boundary /
# host-composition-boundary spec) pinned the same SDK transitively
# through each connector package's own dependency on it. Full requirement
# IDs: specs/portable-deployment/requirements.md,
# specs/host-composition-boundary/requirements.md.
gateway-widgets = [
    "agent-connector-sdk[a2a,mcp]>=0.4.2,<0.5.0",
]
# Messaging channel adapters (CONCEPT:AU-ECO.messaging.native-backend-abstraction):
# each chat platform SDK is its own extra so importing arbora.messaging never
# requires every platform's client library to be installed. Further platforms
# (Discord, Slack, WhatsApp, Teams, Google Chat/Meet, Matrix, IRC, Signal,
# iMessage, LINE, Twitch, Synology Chat, voice calls, Nextcloud Talk) follow
# the same adapter shape and remain to be landed.
# arbora.security.secrets: the KV v2 secret store backend.
vault = ["hvac>=2.4.0"]
messaging-telegram = ["python-telegram-bot>=22.8"]
messaging-mattermost = ["mattermostdriver>=7.3.2"]
messaging-discord = ["discord.py>=2.7.1"]
messaging-slack = ["slack-bolt>=1.30.0"]
messaging-whatsapp = ["neonize>=0.5.2", "httpx>=0.28.1"]
messaging-teams = ["botbuilder-core>=4.17.1"]
messaging-googlechat = ["google-api-python-client>=2.198.0", "google-auth>=2.62.0"]
messaging-googlemeet = ["google-api-python-client>=2.198.0", "google-auth>=2.62.0"]
messaging-matrix = ["matrix-nio>=0.26.0"]
messaging-irc = ["irc>=20.5.0"]
messaging-signal = []
messaging-imessage = []  # macOS-only, AppleScript bridge
messaging-line = ["line-bot-sdk>=3.26.0"]
messaging-twitch = ["twitchio>=3.3.2"]
messaging-synology = ["httpx>=0.28.1"]
messaging-voicecall = ["twilio>=9.12.0"]
messaging-nextcloud = ["httpx>=0.28.1"]
messaging = [
    "arbora[messaging-telegram,messaging-mattermost,messaging-discord,messaging-slack,messaging-whatsapp,messaging-teams,messaging-googlechat,messaging-googlemeet,messaging-matrix,messaging-irc,messaging-signal,messaging-line,messaging-twitch,messaging-synology,messaging-voicecall,messaging-nextcloud]"
]

[project.scripts]
arbora = "arbora.mcp_server.server:mcp_server"
arbora-daemon = "arbora.gateway.daemon:main"
arbora-release-canary = "arbora.deployment.release_canary:main"
arbora-production-ops = "arbora.deployment.production_ops:main"
setup-config = "arbora.deployment.cli:main"
agent-utilities-doctor = "arbora.deployment.doctor:main"
agent-utilities-venv = "arbora.deployment.venv_sync:main"
arbora-wiring-sweep = "arbora.evolution.wiring_sweep:main"
arbora-connector-count-pins = "arbora.fleet.connector_count_pins:main"
arbora-check-import-boundaries = "arbora.architecture.boundary_census:main"
arbora-hosting-config = "arbora.deployment.host_config:main"
arbora-capability-layers = "arbora.architecture.capability_layers:main"

[project.entry-points."agent_connector_sdk.skill_providers"]
arbora = "arbora.skills"

[project.entry-points."agent_utilities.messaging"]
telegram = "arbora.messaging.backends.telegram:TelegramBackend"
mattermost = "arbora.messaging.backends.mattermost:MattermostBackend"
discord = "arbora.messaging.backends.discord:DiscordBackend"
slack = "arbora.messaging.backends.slack:SlackBackend"
whatsapp = "arbora.messaging.backends.whatsapp:WhatsAppBackend"
teams = "arbora.messaging.backends.teams:TeamsBackend"
googlechat = "arbora.messaging.backends.googlechat:GoogleChatBackend"
googlemeet = "arbora.messaging.backends.googlemeet:GoogleMeetBackend"
matrix = "arbora.messaging.backends.matrix:MatrixBackend"
irc = "arbora.messaging.backends.irc:IRCBackend"
signal = "arbora.messaging.backends.signal:SignalBackend"
imessage = "arbora.messaging.backends.imessage:IMessageBackend"
line = "arbora.messaging.backends.line:LINEBackend"
twitch = "arbora.messaging.backends.twitch:TwitchBackend"
synology = "arbora.messaging.backends.synology:SynologyChatBackend"
voicecall = "arbora.messaging.backends.voicecall:VoiceCallBackend"
nextcloud = "arbora.messaging.backends.nextcloud:NextcloudTalkBackend"

[project.entry-points."agent_utilities.messaging.reach"]
notify_sync = "arbora.messaging.reach:notify_sync"
service = "arbora.messaging.reach:service_port"

[tool.uv]
# A dependency's own git pin of the engine never applies here.
override-dependencies = [
    "epistemic-graph[server]>=2.27.5,<3.0.0",
]
# The engine installs from its published wheels only; its sdist (a Rust
# build) is never a candidate.
no-build-package = ["epistemic-graph", "epistemic-graph-server"]

[tool.uv.sources]
# The engine always resolves from the package index, never from a git or
# path source declared by a dependency.
epistemic-graph = { index = "pypi" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true

[tool.setuptools.dynamic]
version = { attr = "arbora._version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["arbora*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
# Every data file under arbora/ ships: a runtime load of a file left out of the
# wheel crash-loops only an installed deploy, never a source-tree test. The
# release workflow's wheel boot gate (scripts/wheel_boot_check.py) fails when
# any non-Python file tracked under arbora/ is missing from the built wheel.
arbora = [
    "**/*.json",
    "**/*.yaml",
    "**/*.yml",
    "**/*.toml",
    "**/*.ttl",
    "**/*.md",
    "**/*.txt",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Deployment modules use long operator remediations and guarded imports. Keep
# these narrow exceptions while retaining import, correctness, and modern
# Python checks across Arbora.
ignore = ["E402", "E501", "B007"]

[tool.ruff.lint.flake8-bugbear]
# FastMCP tool parameters and FastAPI dependencies declare metadata through
# these calls in argument defaults; they are evaluated once and immutable.
extend-immutable-calls = ["pydantic.Field", "fastapi.Depends", "fastmcp.dependencies.Depends"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "spec: binds a test to a spec requirement ID",
    "integration: integration test (moved agent-utilities profile tests)",
    "concept: binds a test to a concept ID (moved agent-utilities tests)",
    "real_boot: boots a real arbora process against a real EG server (linux x86_64)",
]

# Inputs of the shared hooks (Knuckles-Team/pipelines .pre-commit-hooks.yaml).
[tool.pipelines_hooks]
packages = ["arbora"]

[tool.pipelines_hooks.public_surface]
repository = "Knuckles-Team/arbora"
distribution = "arbora"
pages_url = "https://knuckles-team.github.io/arbora/"
mcp_server = true

# The MCP server and gateway serve stdio/HTTP; stdout there is protocol output.
[tool.pipelines_hooks.stdout_writes]
served_paths = ["arbora/mcp_server", "arbora/gateway"]

[tool.pipelines_hooks.ste]
paths = ["README.md", "AGENTS.md", "CLAUDE.md", "CONTRIBUTING.md", "CHANGELOG.md", "docs", "specs"]
exempt = ["specs/_template/*"]
