schema: arbora-boundary-owner-seeds/v1
owner_repository: arbora
manifest_version: 1
source_spec: specs/host-composition-boundary/requirements.md

# ARBORA-HOST-R012 boundary seeds: this repository's own entry and the
# connector SDK's entry in the architecture component registry (RF-021),
# each naming its owning module paths and its public import surface. This
# mirrors agent-utilities' own
# architecture/component-registry-boundary-seeds.yml (which records the
# modules moving FROM agent-utilities TO arbora); this file is the
# receiving side, published from arbora, and is independent of
# architecture/component-registry.yml's cryptographically signed, generated
# component schema -- that registry is a digest-verified artifact for a
# different, already-wired certification path, and hand-adding boundary
# seeds to it would desynchronize its signatures. Boundary seeds get their
# own small, human-read manifest, read by
# tests/test_component_registry_boundary_seeds.py.
seeds:
  - owner_repository: arbora
    requirement_id: ARBORA-HOST-R012
    description: >-
      Arbora's own served-runtime packages: MCP/REST/A2A composition, the
      fleet multiplexer, the gateway, control-plane policy, optional web UI
      hosting, governed browser control, and deployment operations.
    owned_module_paths:
      - arbora/mcp_server
      - arbora/fleet
      - arbora/gateway
      - arbora/control_plane
      - arbora/webui_host
      - arbora/a2a
      - arbora/browser_control
      - arbora/deployment
      - arbora/api
      - arbora/messaging
      - arbora/skills
      - arbora/evolution
      - arbora/ontology
    public_import_surface:
      - arbora.mcp_server.server
      - arbora.api
      - arbora.gateway
      - arbora.fleet
  - owner_repository: agent-connector-sdk
    requirement_id: ARBORA-HOST-R012
    description: >-
      The connector SDK's transport and content-pack boundary that Arbora's
      gateway and fleet modules consume directly: MCP server construction,
      connector manifests, content-pack certification, governed HTTP and
      credentials, and write-back -- never a connector's internal module.
    owned_module_paths:
      - agent_connector_sdk/mcp
      - agent_connector_sdk/manifest
      - agent_connector_sdk/certify
      - agent_connector_sdk/http
      - agent_connector_sdk/credentials
      - agent_connector_sdk/discovery.py
      - agent_connector_sdk/contracts.py
      - agent_connector_sdk/config.py
    public_import_surface:
      - agent_connector_sdk.mcp
      - agent_connector_sdk.manifest
      - agent_connector_sdk.certify
      - agent_connector_sdk.contracts
