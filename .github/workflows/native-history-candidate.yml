name: Installed native history candidate qualification
on:
  workflow_call:
    inputs:
      arbora-ref:
        type: string
        required: true
      scion-ref:
        type: string
        required: true
      producer-ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  installed-restart:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate fixed producer caller and immutable inputs
        env:
          CALLER: ${{ github.repository }}
          SOURCE: ${{ github.sha }}
          PRODUCER: ${{ inputs.producer-ref }}
          ARBORA: ${{ inputs.arbora-ref }}
          SCION: ${{ inputs.scion-ref }}
        run: |
          set -euo pipefail
          test "$CALLER" = Knuckles-Team/medulla
          test "$SOURCE" = "$PRODUCER"
          for sha in "$SOURCE" "$ARBORA" "$SCION"; do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Knuckles-Team/arbora
          ref: ${{ inputs.arbora-ref }}
          path: sources/arbora
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Knuckles-Team/scion-sdk
          ref: ${{ inputs.scion-ref }}
          path: sources/scion
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Knuckles-Team/medulla
          ref: ${{ inputs.producer-ref }}
          path: sources/medulla
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Knuckles-Team/tuig
          ref: 614e033b6ce0bd1e6ee7f7129750c78e2b80e314
          path: sources/tuig
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: '0.12.23'
          enable-cache: false
      # No github-token/run-id: reuse caller's same-run artifact authority.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: validated-eg-wheel-${{ inputs.producer-ref }}
          path: inputs/medulla
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: candidate-medulla-stem-linux-x86_64-${{ inputs.producer-ref }}
          path: inputs/stem
      - name: Build immutable consumer candidates and native Tuig
        env:
          ARBORA_REF: ${{ inputs.arbora-ref }}
          SCION_REF: ${{ inputs.scion-ref }}
          PRODUCER_REF: ${{ inputs.producer-ref }}
        run: |
          set -euo pipefail
          unset PYTHONPATH PYTHONHOME PYTHONOPTIMIZE PYTEST_ADDOPTS PYTEST_PLUGINS
          uv build --wheel sources/arbora --out-dir "$GITHUB_WORKSPACE/wheelhouse"
          uv build --wheel sources/scion --out-dir "$GITHUB_WORKSPACE/wheelhouse"
          rustup toolchain install 1.96.0 --profile minimal
          cargo +1.96.0 build --locked --release --manifest-path sources/tuig/native/agent-terminal-ui/Cargo.toml
          python3 -I sources/arbora/scripts/qualification/prepare_native_history_candidate.py "$GITHUB_WORKSPACE"
      - name: Qualify fresh installed stack with actual process restarts
        env:
          QUALIFICATION_ROOT: ${{ runner.temp }}/installed-native-history
          WHEELHOUSE: ${{ github.workspace }}/wheelhouse
          BINDINGS: ${{ github.workspace }}/runtime-bindings.json
          RESTART_BUNDLE: ${{ github.workspace }}/restart-bundle
          TUIG_BIN: ${{ github.workspace }}/sources/tuig/native/agent-terminal-ui/target/release/tuig
        run: bash sources/arbora/scripts/qualification/qualify_installed.sh
      - name: Publish bounded non-runtime provenance and gate results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-history-candidate-${{ github.sha }}
          path: |
            runtime-bindings.json
            candidate-build-receipt.json
            ${{ runner.temp }}/installed-native-history/evidence/gate-result.json
            ${{ runner.temp }}/installed-native-history/evidence/requirements.lock
          if-no-files-found: error
          retention-days: 7
