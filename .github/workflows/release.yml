name: Release

# Only a v* tag push (or a manual dispatch) publishes: PyPI and the GitHub
# release. A push to main and the nightly schedule run ci.yml, which calls the
# read-only checks.yml and never this workflow. `checks` is the pre-publish
# guard (gates -> build -> install-smoke, wired with `needs:` so a failure
# names its stage); publish-pypi and github-release run only for a tag, and
# github-release alone holds a job-scoped contents: write. Pull requests never
# reach this workflow. Container images have a separate delivery owner.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

concurrency:
  # A publish is never cancelled by a later run.
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: checks
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yml

  publish-pypi:
    timeout-minutes: 60
    name: publish
    needs: [checks]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    # D-ORC-10-style gate (see agent-utilities release.yml): publishing is
    # irreversible, so it must never be a side effect of an ordinary green
    # push to main. Configure required-reviewer protection once on this
    # environment in Settings > Environments > pypi-publish.
    environment: pypi-publish
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arbora-wheel
          path: dist

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'

      - name: Publish wheel and sdist
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple dist/arbora-*.whl dist/arbora-*.tar.gz

  github-release:
    name: github-release
    # Created only after the wheel is on PyPI, so the release never links a
    # project page that does not exist yet.
    needs: [publish-pypi]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Write release notes
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          {
            echo "PyPI: [\`arbora\` $version](https://pypi.org/project/arbora/$version/)"
            echo
            echo '```bash'
            echo "pip install \"arbora[webui]==$version\""
            echo '```'
            echo
            echo "Installs from PyPI on Linux (x86_64, aarch64), macOS (arm64) and"
            echo "Windows (x86_64); macOS x86_64 and Windows arm64 await engine wheels."
            echo
            echo "Commit: $SHA"
          } > "$RUNNER_TEMP/notes.md"
      - name: Create or update the GitHub release
        run: |
          set -euo pipefail
          # A pre-release tag (v0.1.8.dev1, v0.1.8rc1) never becomes the latest release.
          kind=--latest
          case "$TAG" in *dev*|*rc*|*a[0-9]*|*b[0-9]*) kind=--prerelease ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "$kind" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "$kind" \
              --title "Release $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
