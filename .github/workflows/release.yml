name: Release

# ─────────────────────────────────────────────────────────────────────────
# Modeled on agent-utilities'/epistemic-graph's release.yml two-workflow
# split: this file is the ONLY workflow that can block a release
# (gates -> build -> publish-pypi, wired with `needs:` so a failure names its
# stage at a glance). Scanner quality is advisory: it reports on every run
# and never blocks a merge or a release; its native toolchain is still
# runner-provisioned. Everything else (Pages) lives in its own workflow.
#
# CI runs this repository's own .pre-commit-config.yaml -- the commit and
# push stages over every file, then the manual-stage hooks that need the
# provisioned environment -- so CI and local hooks can never run different
# gate code. Shared gates come from Knuckles-Team/pipelines at `main` -- the
# one sanctioned exception to this repository's immutable-pin policy.
# `scanner-quality` provisions the pinned cccc/kiss (the fleet's own fork
# build)/dupehound/jscpd toolchain on the runner (hooks never install
# scanners) and runs their census and differential forms; the diff-scoped
# `complexity-staged` / `kiss-staged` hooks compare the staged index with
# HEAD, which is empty on a fresh checkout.
#
# The package is pure Python and builds from this repository alone: every
# dependency, the epistemic-graph engine wheels included, installs from PyPI
# at the version uv.lock pins. No sibling source is checked out and nothing
# is compiled. `install-smoke` installs the built wheel and its locked PyPI
# dependencies on Linux, macOS and Windows (x64 and arm64) before a tag can
# publish. Container images have a separate delivery owner and are not
# published by this wheel workflow.
# ─────────────────────────────────────────────────────────────────────────

# Triggers (CI-STANDARD): pull requests run diff-scoped gates and a real wheel build.
# Main pushes run the full suite and builds. Only version tags publish. Docs/spec-only changes start nothing
# here; .github/workflows/gates-skip.yml reports the `gates` check for them.
on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - 'specs/**'
      - 'docs/**'
      - '**/*.md'
      - 'plans/**'
      - 'LICENSE'
    tags:
      - 'v*'
  pull_request:
    paths-ignore:
      - 'specs/**'
      - 'docs/**'
      - '**/*.md'
      - 'plans/**'
      - 'LICENSE'
  workflow_dispatch: {}

concurrency:
  # PR and main runs cancel superseded work; a tag/dispatch publish never cancels.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}-{1}', github.workflow, github.event.pull_request.number) || (github.ref_type == 'tag' && format('release-{0}-{1}', github.workflow, github.ref) || format('main-{0}', github.workflow)) }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  # Resolve the shared gate source (Knuckles-Team/pipelines `main`) exactly
  # once per workflow run. Attempt 1 records the commit as an artifact; a
  # re-run of all jobs reads it back and a re-run of failed jobs keeps this
  # job's recorded output, so a re-run never sees a newer gate than attempt 1.
  freeze-gate-source:
    name: freeze-gate-source
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
    steps:
      - name: Resolve pipelines main (first attempt only)
        if: github.run_attempt == 1
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/Knuckles-Team/pipelines refs/heads/main | cut -f1)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "could not resolve pipelines main" >&2; exit 1; }
          printf '%s\n' "$sha" > "$RUNNER_TEMP/pipelines-ref"
      - name: Record the commit for re-runs
        if: github.run_attempt == 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pipelines-ref
          path: ${{ runner.temp }}/pipelines-ref
      - name: Read the commit recorded by attempt 1
        if: github.run_attempt > 1
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pipelines-ref
          path: ${{ runner.temp }}/recorded
      - id: ref
        run: |
          set -euo pipefail
          f="$RUNNER_TEMP/pipelines-ref"
          [ -f "$f" ] || f="$RUNNER_TEMP/recorded/pipelines-ref"
          sha="$(tr -d '[:space:]' < "$f")"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "recorded gate source is not a commit: $sha" >&2; exit 1; }
          echo "Shared gate source for this run: pipelines@$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  gates:
    # PR gates are diff-scoped and install only published wheels. The
    # chain measures ~15-17 min (commit hooks, prose lint, locked
    # environment type check, and the full pytest suite whenever the
    # pr-test-scope resolves to FULL), so the old 15 min PR cap killed
    # the job mid-suite on every pull request. Measured 2026-10-23 on the
    # #358 train: 25 min elapsed with 4543 tests passed in 16 min, and
    # the job was cancelled at the 25 min cap during teardown; PR gets 35.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 35 || 60 }}
    name: gates
    needs: [freeze-gate-source]
    # Homelab self-hosted runner for same-repo push/PR traffic (the org
    # runner group is scoped to the 6 core repos already); a fork PR's head
    # repo never matches `github.repository`, so it always lands on the
    # GitHub-hosted runner -- self-hosted capacity is never offered to an
    # untrusted fork without the separate first-run approval gate.
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "homelab"]') || 'ubuntu-latest' }}
    env:
      PIPELINES_REF: ${{ needs.freeze-gate-source.outputs.sha }}
      # The homelab self-hosted runner is itself an RKE2 pod, so Kubernetes
      # injects KUBERNETES_SERVICE_HOST -- agent_utilities.core.live_mount_guard
      # (D-EGK-1) reads that as "running inside a pod" and asserts a hostPath
      # live-mount or a build-time .source-revision provenance marker, neither
      # of which this job's plain checkout has or needs. This is a CI
      # checkout, not a deployed arbora instance, so the check is a false
      # positive here; skip it explicitly rather than fabricating a marker.
      AGENT_UTILITIES_SKIP_LIVE_MOUNT_CHECK: "true"
    steps:
      # YAML anchors, reused by `scanner-quality` and `build`: jscpd's
      # differential gate flags a copy-pasted preamble as a new same-file
      # duplicate; this is the fix, not a jscpd exclusion.
      - &release-checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # One astral-sh/setup-uv step provisions both the pinned uv binary and
      # the pinned Python -- not actions/setup-python, whose downloaded
      # CPython build requires AVX2 and crashes on the AVX2-free homelab
      # self-hosted runners this job (and `build`) may land on. uv's own
      # python-build-standalone download has no such requirement.
      - &release-uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'
          python-version: '3.14'
          enable-cache: true
          cache-dependency-glob: uv.lock
          # A pull request restores the cache but never saves it: saving tars
          # the self-hosted runner's whole uv cache, which ran a green PR
          # gates job past its 15-minute budget. Main and tags still save.
          save-cache: ${{ github.event_name != 'pull_request' }}

      - name: Provision pinned Helm for deployment render tests
        env:
          HELM_VERSION: v4.3.1
          HELM_SHA256: 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b
        run: |
          set -euo pipefail
          tool_dir="$(mktemp -d "$RUNNER_TEMP/helm.XXXXXX")"
          archive="$tool_dir/helm.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --proto '=https' --tlsv1.2 \
            "https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$HELM_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$tool_dir" linux-amd64/helm
          test "$("$tool_dir/linux-amd64/helm" version --template '{{.Version}}')" = "$HELM_VERSION"
          printf '%s\n' "$tool_dir/linux-amd64" >> "$GITHUB_PATH"

      # The base the differential hooks compare against: the pull request base
      # or the previous push, else the root commit (a first push scans all of
      # it). An unavailable object is never an invented empty baseline.
      - &release-base
        name: Resolve the published base
        run: |
          set -euo pipefail
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            BASE="$(git rev-list --max-parents=0 HEAD)"
          fi
          echo "PRE_COMMIT_FROM_REF=$BASE" >> "$GITHUB_ENV"
          # Every gate below uses the shared gate source frozen for this run.
          echo "PINNED_PRECOMMIT=$(bash scripts/pin_gate_source.sh "$PIPELINES_REF" "$RUNNER_TEMP/pre-commit-pinned.yaml")" >> "$GITHUB_ENV"

      # The prohibited-identity catalog is operator-owned and never committed;
      # a missing catalog makes the tracked-privacy hook fail closed.
      - name: Commit- and push-stage hooks (.pre-commit-config.yaml)
        env:
          PROHIBITED_IDENTITY_CATALOG: ${{ vars.PROHIBITED_IDENTITY_CATALOG }}
        run: |
          set -euo pipefail
          if [ -n "${PROHIBITED_IDENTITY_CATALOG:-}" ]; then
            mkdir -p "$HOME/.config/agent-utilities/governance"
            printf '%s' "$PROHIBITED_IDENTITY_CATALOG" > "$HOME/.config/agent-utilities/governance/prohibited-identities.json"
          fi
          # ste-staged (prose lint) is advisory: the report-only step below
          # runs it, so it never blocks a merge or a release.
          SKIP="${SKIP:+$SKIP,}ste-staged"
          export SKIP
          # Pull requests check the diff only (--from-ref/--to-ref); main and
          # tags check every file at both stages.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="--from-ref $PRE_COMMIT_FROM_REF --to-ref HEAD"
          else
            range="--all-files"
            # Trailers belong to pull request commits; a squash merge does
            # not carry the Spec: trailer, so push and tag runs skip the hook.
            SKIP="${SKIP:+$SKIP,}spec-trailers"
            export SKIP
          fi
          uvx --from pre-commit==4.6.0 pre-commit run --config "$PINNED_PRECOMMIT" $range --show-diff-on-failure
          uvx --from pre-commit==4.6.0 pre-commit run --config "$PINNED_PRECOMMIT" $range --hook-stage pre-push --show-diff-on-failure

      - name: Prose lint (ste-staged, advisory, report-only)
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="--from-ref $PRE_COMMIT_FROM_REF --to-ref HEAD"
          else
            range="--all-files"
          fi
          uvx --from pre-commit==4.6.0 pre-commit run --config "$PINNED_PRECOMMIT" ste-staged $range

      # External-index availability is a release boundary, not a PR/push
      # boundary. Repository-manager's one readiness primitive checks the
      # package versions that this wheel declares before a tag can build.
      # It is gate tooling, not a dependency: scripts/local_hook.sh installs
      # it with --no-sources, so its own agent-utilities requirement resolves
      # from PyPI rather than from a sibling source path.
      - name: Checkout pinned release-readiness implementation
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Knuckles-Team/repository-manager
          ref: 0671b97250c7a2e87a1f63b43818e99eb90709a1
          path: .uv-workspace-siblings/repository-manager
          persist-credentials: false

      # Advisory (operator gate cut, 2026-10-17): the pinned repository-manager
      # tool requires agent-utilities<3 and cannot install beside AU 3, and it
      # reports wheel-only dependencies as partial publishes. The six-platform
      # install-smoke matrix below proves every locked dependency installs
      # from PyPI before publish.
      - name: Release dependency readiness (advisory, report-only)
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          set -euo pipefail
          uvx --from pre-commit==4.6.0 pre-commit run --config "$PINNED_PRECOMMIT" dependency-readiness --hook-stage manual --all-files

      # Every dependency installs from PyPI exactly as uv.lock pins it, the
      # published epistemic-graph wheel (numeric kernel included) among them;
      # no sibling source checkout or source overlay exists.
      - name: Sync test environment
        run: |
          set -euo pipefail
          uv sync --frozen --extra test --extra webui

      - name: Verify the engine client is the published wheel
        run: |
          set -euo pipefail
          uv run --no-sync python -I -c '
          import importlib.metadata as md
          import epistemic_graph.numeric
          from epistemic_graph.generated import connector_pack, source_ingestion, storage
          assert connector_pack.ConnectorPackStatusRequest
          assert source_ingestion.SourceCheckpoint
          assert storage.send_agent_component_content
          for name in ("epistemic-graph", "epistemic-graph-server", "agent-utilities", "agent-connector-sdk", "agent-webui"):
              direct = md.distribution(name).read_text("direct_url.json")
              assert direct is None, f"{name} is not an index install: {direct}"
              print(name, md.version(name))
          '

      - name: Locked-environment type check (manual-stage hook, always full)
        run: uvx --from pre-commit==4.6.0 pre-commit run --config "$PINNED_PRECOMMIT" mypy-env --hook-stage manual --all-files

      # Operator decision (2026-10-09): PR gates run a fast subset so a PR
      # auto-merges within minutes -- lint and the spec check already ran
      # full above (the commit-stage pre-commit step), the type check just
      # ran full too, and only the test matrix narrows here. `push` to main
      # and a release tag are never `pull_request` and keep running the full
      # suite unchanged via the manual-stage `pytest` hook, exactly as before.
      - name: Resolve pull-request test scope
        if: github.event_name == 'pull_request'
        id: pr-test-scope
        run: |
          set -euo pipefail
          uvx --from "git+https://github.com/Knuckles-Team/pipelines@${PIPELINES_REF}" \
            pipelines-hook pr-test-scope --base-ref "$PRE_COMMIT_FROM_REF" \
            --src-root arbora --tests-root tests > "$RUNNER_TEMP/pr-test-scope.txt"
          cat "$RUNNER_TEMP/pr-test-scope.txt"
          {
            echo "scope<<PR_TEST_SCOPE_EOF"
            cat "$RUNNER_TEMP/pr-test-scope.txt"
            echo "PR_TEST_SCOPE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Full test suite (push to main / release tag; manual-stage hook)
        if: github.event_name != 'pull_request'
        run: uvx --from pre-commit==4.6.0 pre-commit run --config "$PINNED_PRECOMMIT" pytest --hook-stage manual --all-files

      - name: Test suite -- pull request fast subset
        if: github.event_name == 'pull_request'
        env:
          SCOPE: ${{ steps.pr-test-scope.outputs.scope }}
        run: |
          set -euo pipefail
          if [ "$SCOPE" = "NONE" ]; then
            echo "pr-test-scope: no arbora/tests change in this diff; skipping pytest"
          elif [ "$SCOPE" = "FULL" ]; then
            echo "pr-test-scope: unmapped source change (or an unreadable diff); running the full suite"
            scripts/local_hook.sh pytest
          else
            echo "pr-test-scope: running only the tests this diff affects:"
            echo "$SCOPE"
            # pytest 9 drops a conftest.py's fixtures for a directory whose
            # files are interleaved with another directory's in the argument
            # list ("fixture 'stdio_fleet_authority' not found"); the scope
            # arrives in arbitrary order, so group each directory's files.
            mapfile -t affected_tests < <(printf '%s\n' "$SCOPE" | awk -F/ '{d=$0; sub(/\/[^\/]*$/, "", d); print d "\t" $0}' | sort | cut -f2)
            scripts/local_hook.sh pytest "${affected_tests[@]}"
          fi

  scanner-scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - *release-checkout
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "$BASE_SHA...HEAD" -- scripts/gen_api.py arbora/client arbora/api/generated docs/api .github/workflows/release.yml scripts/install_scanners.sh; then
            echo "required=false" >> "$GITHUB_OUTPUT"
          else
            result=$?
            [ "$result" -eq 1 ] || exit "$result"
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

  # Scanners (complexity, KISS, cccc, dupehound, jscpd) are advisory: they
  # report on every run and never block a merge or a release (operator
  # direction, 2026-10-17).
  scanner-quality:
    if: >-
      always() && needs.freeze-gate-source.result == 'success' &&
      ((github.event_name == 'push' && github.ref_type == 'branch') ||
      (github.event_name == 'pull_request' && needs.scanner-scope.outputs.required == 'true'))
    timeout-minutes: 60
    continue-on-error: true
    name: Scanner quality (cccc, KISS, dupehound, jscpd)
    needs: [freeze-gate-source, scanner-scope]
    runs-on: ubuntu-latest
    env:
      PIPELINES_REF: ${{ needs.freeze-gate-source.outputs.sha }}
      CARGO_BUILD_JOBS: "4"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      - *release-checkout
      - *release-uv

      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: stable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Resolve scanner cache identity
        id: scanner-cache-identity
        env:
          SCANNER_RECIPE: ${{ hashFiles('scripts/install_scanners.sh') }}
        run: |
          set -euo pipefail
          rustc_identity="$(rustc -Vv)"
          cargo_identity="$(cargo -V)"
          identity="$(printf '%s\0' \
            "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-}" "${ImageVersion:-}" \
            "$SCANNER_RECIPE" "$rustc_identity" "$cargo_identity" \
            "$CARGO_BUILD_JOBS" "$CARGO_PROFILE_RELEASE_DEBUG" \
            "${RUSTFLAGS:-}" "${CARGO_ENCODED_RUSTFLAGS:-}" | sha256sum)"
          printf 'key=arbora-scanners-v1-%s\n' "${identity%% *}" >> "$GITHUB_OUTPUT"

      - name: Restore scanner toolchain
        id: scanner-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/arbora-scanners
          key: ${{ steps.scanner-cache-identity.outputs.key }}

      # Each scanner is installed to its own runner-local prefix at the
      # version the shared scanner-versions hook verifies (the same script
      # scripts/bootstrap.sh --scanners runs locally). Always run the installer:
      # a cache hit must still pass the provider's receipt and build probes.
      - name: Provision pinned scanner toolchain
        run: bash scripts/install_scanners.sh "$RUNNER_TEMP/arbora-scanners" >> "$GITHUB_PATH"

      - *release-base

      - name: Shared scanner hooks (versions, censuses, clone differentials)
        env:
          CX_DUP_BASE_REF: ${{ env.PRE_COMMIT_FROM_REF }}
        run: |
          set -euo pipefail
          uvx --from "git+https://github.com/Knuckles-Team/pipelines@${PIPELINES_REF}" \
            pipelines-hook scanner-versions cccc kiss dupehound jscpd
          for hook in complexity-census kiss-census dupehound-changed jscpd-differential jscpd-census; do
            uvx --from pre-commit==4.6.0 pre-commit run --config "$PINNED_PRECOMMIT" "$hook" --hook-stage manual --all-files
          done

      - name: Save verified scanner toolchain
        if: success() && steps.scanner-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/arbora-scanners
          key: ${{ steps.scanner-cache-identity.outputs.key }}

  build:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 60 }}
    name: build
    # Validate the actual wheel on PRs; publication remains tag-only.
    needs: [gates]
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "homelab"]') || 'ubuntu-latest' }}
    env:
      SOURCE_DATE_EPOCH: "0"
    steps:
      - *release-checkout
      - *release-uv

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      # Release-blocking: every non-Python file tracked under arbora/ must be
      # package data. Source-tree tests cannot see a file the wheel leaves out
      # (0.1.0 shipped without api/registry/eg_exclusions.yaml).
      - name: Wheel carries every data file
        run: uv run --no-project python -I scripts/wheel_boot_check.py contents dist/arbora-*.whl

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arbora-wheel
          path: |
            dist/arbora-*.whl
            dist/arbora-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  # The wheel is pure Python, so one build serves every platform; what differs
  # per platform is whether the locked PyPI dependency set installs and
  # imports there. Each leg installs uv.lock's exact, hash-checked
  # requirements from PyPI, then the built wheel with no dependency
  # resolution of its own, and imports the composition root. Linux and
  # Windows x64, Linux arm64 and macOS arm64 are the platforms the
  # epistemic-graph engine publishes wheels for and gate the release. macOS
  # x64 and Windows arm64 run and report on every release; they are
  # non-blocking only because no engine wheel exists for them yet, so a red
  # leg there names that gap instead of hiding it.
  install-smoke:
    name: install ${{ matrix.name }}
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            runner: ubuntu-24.04
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: macos-aarch64
            runner: macos-14
          - name: macos-x86_64
            runner: macos-15-intel
            optional: true
          - name: windows-x86_64
            runner: windows-latest
          - name: windows-aarch64
            runner: windows-11-arm
            optional: true
    defaults:
      run:
        shell: bash
    steps:
      - *release-checkout
      - *release-uv

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arbora-wheel
          path: dist

      - name: Install the locked PyPI dependencies, then the wheel
        run: |
          set -euo pipefail
          uv export --frozen --no-emit-project --no-dev --extra webui \
            --format requirements.txt --output-file "$RUNNER_TEMP/locked.txt"
          uv venv --python 3.14 "$RUNNER_TEMP/smoke"
          py="$RUNNER_TEMP/smoke/bin/python"
          [ -x "$py" ] || py="$RUNNER_TEMP/smoke/Scripts/python.exe"
          echo "SMOKE_PYTHON=$py" >> "$GITHUB_ENV"
          # --no-config: the export already carries this project's
          # [tool.uv] overrides as exact pins; re-reading them would turn
          # them back into ranges --require-hashes refuses.
          uv pip install --no-config --python "$py" --require-hashes --no-deps \
            --index-url https://pypi.org/simple -r "$RUNNER_TEMP/locked.txt"
          uv pip install --no-config --python "$py" --no-deps dist/arbora-*.whl
          uv pip check --no-config --python "$py"

      - name: Import the composition root from PyPI-installed dependencies
        run: |
          set -euo pipefail
          "$SMOKE_PYTHON" -I -c '
          import importlib.metadata as md
          import arbora, agent_utilities, agent_connector_sdk, agent_webui
          import epistemic_graph.numeric
          from arbora.deployment import cli
          for name in ("epistemic-graph", "epistemic-graph-server", "agent-utilities", "agent-connector-sdk", "agent-webui"):
              assert md.distribution(name).read_text("direct_url.json") is None, name
              print(name, md.version(name))
          print("arbora", md.version("arbora"))
          '

      # Release-blocking wheel boot gate. From a directory outside the source
      # tree, the installed wheel must import from the venv, carry every file
      # its RECORD names, build the full operation registry (EG exclusions and
      # the default policy load as package data), and answer `arbora --help`
      # and `--version` with no configuration.
      - name: Boot the installed wheel outside the source tree
        run: |
          set -euo pipefail
          boot="$RUNNER_TEMP/wheel-boot"
          mkdir -p "$boot"
          cp scripts/wheel_boot_check.py "$boot/"
          cd "$boot"
          "$SMOKE_PYTHON" -I wheel_boot_check.py runtime

      # Linux x64 also boots a real arbora process against the
      # epistemic-graph-server binary from the installed engine wheel, with
      # arbora imported from the installed wheel. A skip fails the gate.
      - name: Real boot of the installed wheel (linux x86_64)
        if: matrix.name == 'linux-x86_64'
        run: |
          set -euo pipefail
          uv export --frozen --no-emit-project --no-dev --extra webui --extra test \
            --format requirements.txt --output-file "$RUNNER_TEMP/locked-test.txt"
          uv pip install --no-config --python "$SMOKE_PYTHON" --require-hashes --no-deps \
            --index-url https://pypi.org/simple -r "$RUNNER_TEMP/locked-test.txt"
          boot="$RUNNER_TEMP/real-boot"
          mkdir -p "$boot"
          cp tests/test_real_boot.py tests/_boot_connector.py tests/_boot_model.py tests/_boot_ingest_connector.py tests/_boot_ingest_manifest.yml tests/conftest.py "$boot/"
          printf '%s\n' '[pytest]' 'asyncio_mode = auto' 'markers =' \
            '    spec: binds a test to a spec requirement ID' \
            '    real_boot: boots a real arbora process against a real EG server' \
            > "$boot/pytest.ini"
          cd "$boot"
          "$SMOKE_PYTHON" -I -c 'import arbora, sys; from pathlib import Path; p = Path(arbora.__file__).resolve(); assert Path(sys.prefix).resolve() in p.parents, p; print(p)'
          "$SMOKE_PYTHON" -I -m pytest -p no:cacheprovider -rA --junitxml=real-boot.xml test_real_boot.py
          "$SMOKE_PYTHON" -I -c '
          import xml.etree.ElementTree as ET
          suite = ET.parse("real-boot.xml").getroot().find("testsuite")
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          failed = int(suite.get("failures")) + int(suite.get("errors"))
          assert tests > 0 and skipped == 0 and failed == 0, (tests, skipped, failed)
          print(f"real boot: {tests} passed against the installed wheel")
          '

  backward-python:
    # The one backward-support leg (pipelines reference/gate-standard.md
    # "Python version"): the environment is 3.14 and requires-python keeps a
    # 3.12 floor, so install the lock on 3.12, import the composition root and
    # run the fleet conftest's tests there.
    name: backward-python (3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - *release-checkout
      - *release-uv
      - name: Install and import on the 3.12 floor
        run: |
          set -euo pipefail
          uv sync --frozen --python 3.12 --extra test --extra webui
          uv run --frozen --no-sync python -c 'import sys, arbora; from arbora.deployment import cli; print(sys.version)'
          uv run --frozen --no-sync pytest -q tests/fleet

  publish-pypi:
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 60 }}
    name: publish
    needs: [build, install-smoke]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    # D-ORC-10-style gate (see agent-utilities release.yml): publishing is
    # irreversible, so it must never be a side effect of an ordinary green
    # push to main. Configure required-reviewer protection once on this
    # environment in Settings > Environments > pypi-publish.
    environment: pypi-publish
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: arbora-wheel
          path: dist

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.1'

      - name: Publish wheel and sdist
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple dist/arbora-*.whl dist/arbora-*.tar.gz

  github-release:
    name: github-release
    # Created only after the wheel is on PyPI, so the release never links a
    # project page that does not exist yet.
    needs: [publish-pypi]
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Write release notes
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          {
            echo "PyPI: [\`arbora\` $version](https://pypi.org/project/arbora/$version/)"
            echo
            echo '```bash'
            echo "pip install \"arbora[webui]==$version\""
            echo '```'
            echo
            echo "Installs from PyPI on Linux (x86_64, aarch64), macOS (arm64) and"
            echo "Windows (x86_64); macOS x86_64 and Windows arm64 await engine wheels."
            echo
            echo "Commit: $SHA"
          } > "$RUNNER_TEMP/notes.md"
      - name: Create or update the GitHub release
        run: |
          set -euo pipefail
          # A pre-release tag (v0.1.8.dev1, v0.1.8rc1) never becomes the latest release.
          kind=--latest
          case "$TAG" in *dev*|*rc*|*a[0-9]*|*b[0-9]*) kind=--prerelease ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" "$kind" \
              --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag "$kind" \
              --title "Release $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
