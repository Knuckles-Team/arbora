name: Gates skip

# Companion of a caller whose gates workflow uses paths-ignore: a docs/spec-only
# change skips the real workflow, so this one reports the same required check
# name as a success and branch protection never waits on it. The `paths:` list
# is the exact inverse of the caller's `paths-ignore:`.
# Name the job like the real one (`gates`); a caller whose check shows as
# `<workflow> / gates` must name this workflow identically.

on:
  pull_request:
    paths:
      - specs/**
      - docs/**
      - '**/*.md'
      - plans/**
      - LICENSE

permissions:
  contents: read

concurrency:
  group: pr-gates-skip-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "docs/spec-only change; the code gates do not apply"

  # The main ruleset also requires these two release.yml jobs; on a docs/spec-only
  # change that workflow is skipped, so report them here too.
  scanner-quality:
    name: Scanner quality (cccc, KISS, dupehound, jscpd)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "docs/spec-only change; the scanners do not apply"

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "docs/spec-only change; nothing to build"
